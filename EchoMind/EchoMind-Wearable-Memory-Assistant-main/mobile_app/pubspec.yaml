name: wearable_memory_assistant
description: Wearable AI Personal Memory Assistant prototype
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  record: ^5.2.1
  path_provider: ^2.1.4
  flutter_riverpod: ^2.6.1
  web_socket_channel: ^3.0.1
  firebase_core: ^3.7.0
  firebase_messaging: ^15.1.5
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.5.1
  nsd: ^5.0.1
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1

dependency_overrides:
  record_platform_interface: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
